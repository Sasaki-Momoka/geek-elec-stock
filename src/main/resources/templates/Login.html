<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>サインイン</title>
	<link rel="stylesheet" href="../static/css/login.css">
</head>

<img>
	<text align="center">
	<h2>ログイン</h2>
	</text>

<div th:if="${param.error}">
  <div style="color: red;">

    <span th:text="${session.SPRING_SECURITY_LAST_EXCEPTION?.message ?: 'ログインに失敗しました'}"></span>
  </div>
</div>

<div class="logo">
 <img src="../static/Logodummy.png"></img>
</div>


	<form th:action="@{/signin}" th:object="${adminloginForm}" method="post">
		
		<div class="mail">
			<label>Email:</label>
			<input type="text" th:field="*{email}" name="email"/>
			<div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:red;"></div>
		</div>
		<div class="password">
			<label>Password:</label>
			<input type="password" th:field="*{password}" />
			<div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color:red;"></div>
		</div>
		<div class="button">
			<button type="submit">ログイン</button>
		</div>
		
		<div class="forgot">
			<a href="xxxx.html">パスワードを忘れた場合はこちら</a>
		</div>
		
	</form>
</body>

</html>
